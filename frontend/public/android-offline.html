<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#28110b" />
    <title>Campfire — Mất kết nối</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background: #1b0b07;
        color: #fff4df;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding: calc(24px + env(safe-area-inset-top)) 24px
          calc(24px + env(safe-area-inset-bottom));
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        border: 1px solid #6d3825;
        border-radius: 22px;
        height: 88px;
        margin-bottom: 20px;
        object-fit: cover;
        width: 88px;
      }
      h1 {
        font-size: 1.55rem;
        letter-spacing: -0.03em;
        margin: 0 0 10px;
      }
      p {
        color: #d8bca8;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        background: #ff9f43;
        border: 0;
        border-radius: 14px;
        color: #2b1509;
        font: inherit;
        font-weight: 800;
        min-height: 48px;
        padding: 0 24px;
      }
      button:focus-visible {
        outline: 3px solid #fff4df;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="campfire-logo.jpeg" alt="" />
      <h1>Chưa thể kết nối tới Campfire</h1>
      <p>Hãy kiểm tra Wi-Fi hoặc dữ liệu di động, rồi thử kết nối lại.</p>
      <button type="button" onclick="location.href = 'https://tamsuvoinhau.cloud'">Thử lại</button>
    </main>
  </body>
</html>
