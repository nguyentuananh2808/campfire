<div class="message-action-anchor" [class.mine]="mine()">
  <button
    class="action-trigger"
    type="button"
    aria-label="Mở cảm xúc và trả lời"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M9 10h.01M15 10h.01M8.8 14a4.2 4.2 0 0 0 6.4 0"></path>
    </svg>
  </button>

  @if (open()) {
    <div class="action-tray" role="toolbar" aria-label="Cảm xúc và trả lời tin nhắn">
      @for (reaction of reactions; track reaction.code) {
        <button
          type="button"
          class="reaction-option"
          [class.selected]="selectedReaction() === reaction.code"
          [attr.aria-label]="reaction.label"
          [attr.aria-pressed]="selectedReaction() === reaction.code"
          (click)="react(reaction.code)"
        >
          {{ reaction.emoji }}
        </button>
      }
      <span class="tray-divider" aria-hidden="true"></span>
      <button class="reply-option" type="button" aria-label="Trả lời tin nhắn" (click)="reply()">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="m9 8-5 4 5 4v-3h4.5c3 0 5 1.4 6.5 4-0.3-5.4-2.7-8-7-8H9V8Z"></path>
        </svg>
      </button>
    </div>
  }
</div>
