<button
  type="button"
  [attr.aria-pressed]="theme.theme() === 'dark'"
  [attr.aria-label]="
    theme.theme() === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'
  "
  (click)="theme.toggle()"
>
  @if (theme.theme() === 'dark') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3.5" />
      <path
        d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19.8 15.2A8.4 8.4 0 0 1 8.8 4.2 8.5 8.5 0 1 0 19.8 15.2Z" />
    </svg>
  }
</button>
